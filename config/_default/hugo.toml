# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/getting-started/

theme = "blowfish"
# baseURL = "https://your_domain.com/"
defaultContentLanguage = "en"

enableRobotsTXT = true
[pagination]
  pagerSize = 20
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true

powered_by = ""

# googleAnalytics = "G-XXXXXXXXX"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[contentTypes]
  [contentTypes.'text/asciidoc']
  [contentTypes.'text/markdown']
  [contentTypes.'text/org']
  [contentTypes.'text/pandoc']
  [contentTypes.'text/rst']

[caches]
  [caches.images]
    dir = ':cacheDir/images'
