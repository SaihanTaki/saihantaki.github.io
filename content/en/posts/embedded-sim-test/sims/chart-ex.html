<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Fira Code', monospace, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      overflow: hidden;
    }

    .chart-wrapper {
      position: relative;
      height: calc(100vh - 70px); /* Dynamically fills available iframe height */
      width: 100%;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      gap: 15px;
      font-size: 13px;
    }

    .control-label {
      font-weight: 500;
      color: #4a5568;
    }

    .btn-group {
      display: inline-flex;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
    }

    .btn-group button {
      background: transparent;
      border: none;
      border-right: 1px solid #cbd5e1;
      padding: 5px 12px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-group button:last-child {
      border-right: none;
    }

    .btn-group button.active {
      background-color: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
    }

    .btn-group button:hover:not(.active) {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="chart-wrapper">
    <canvas id="distributionChart"></canvas>
  </div>

  <div class="controls">
    <span class="control-label">Range</span>
    <div class="btn-group" id="rangeGroup">
      <button class="active" onclick="setRange(0.1, this)">0.1</button>
      <button onclick="setRange(1, this)">1</button>
      <button onclick="setRange(10, this)">10</button>
      <button onclick="setRange(100, this)">100</button>
      <button onclick="setRange(1000, this)">1,000</button>
    </div>

    <div class="btn-group" id="modeGroup">
      <button onclick="setMode('abs', this)">Abs</button>
      <button class="active" onclick="setMode('%', this)">%</button>
    </div>
  </div>

<script>
  const models = [
    { name: 'Qwen3 Coder', color: '#b45309', std: 0.022, peak: 23 },
    { name: 'DeepSeek R1', color: '#b91c1c', std: 0.024, peak: 22 },
    { name: 'GLM4.7 Flash', color: '#0284c7', std: 0.030, peak: 17 },
    { name: 'Voxtral Mini', color: '#15803d', std: 0.013, peak: 38 },
    { name: 'GPT OSS',      color: '#1d4ed8', std: 0.015, peak: 32 },
    { name: 'LFM2.5',       color: '#be185d', std: 0.016, peak: 33 }
  ];

  let currentRange = 0.1;
  let currentMode = '%';

  function gaussian(x, mean, std) {
    return Math.exp(-0.5 * Math.pow((x - mean) / std, 2));
  }

  function generateData(range, mode) {
    const points = 300;
    const step = (range * 2) / points;
    const xValues = [];
    
    for (let i = 0; i <= points; i++) {
      xValues.push(-range + i * step);
    }

    const datasets = models.map(model => {
      const dataPoints = xValues.map(x => {
        let y = gaussian(x, 0, model.std) * model.peak;
        if (mode === 'abs') {
          y = y * 1e7; 
        }
        return { x: x, y: y };
      });

      return {
        label: model.name,
        data: dataPoints,
        borderColor: model.color,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.4
      };
    });

    return { xValues, datasets };
  }

  const zeroLinePlugin = {
    id: 'zeroLine',
    beforeDraw(chart) {
      const { ctx } = chart;
      const xZero = chart.scales.x.getPixelForValue(0);
      
      if (xZero >= chart.chartArea.left && xZero <= chart.chartArea.right) {
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#a1a1aa';
        ctx.lineWidth = 1;
        ctx.moveTo(xZero, chart.chartArea.top);
        ctx.lineTo(xZero, chart.chartArea.bottom);
        ctx.stroke();
        ctx.restore();
      }
    }
  };

  Chart.register(zeroLinePlugin);

  const ctx = document.getElementById('distributionChart').getContext('2d');
  const initialData = generateData(currentRange, currentMode);

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: initialData.datasets
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: {
        legend: {
          position: 'right',
          labels: {
            usePointStyle: true,
            pointStyle: 'line',
            font: { family: 'Fira Code', size: 12 },
            boxWidth: 15,
            padding: 12
          }
        },
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}: ${ctx.raw.y.toFixed(2)}${currentMode}`
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          min: -currentRange,
          max: currentRange,
          title: {
            display: true,
            text: 'parameter value range',
            font: { family: 'Fira Code', size: 12 },
            color: '#71717a'
          },
          ticks: {
            font: { family: 'Fira Code' },
            callback: (val) => val === 0 ? '0' : val.toString()
          },
          grid: { display: false }
        },
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: currentMode === '%' ? '% of parameters in range' : 'Absolute Count',
            font: { family: 'Fira Code', size: 12 },
            color: '#71717a'
          },
          ticks: {
            font: { family: 'Fira Code' },
            callback: (val) => currentMode === '%' ? val + '%' : val.toExponential(1)
          },
          grid: { color: '#f3f4f6' }
        }
      }
    }
  });

  function setRange(val, btn) {
    currentRange = val;
    document.querySelectorAll('#rangeGroup button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateChart();
  }

  function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('#modeGroup button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateChart();
  }

  function updateChart() {
    const newData = generateData(currentRange, currentMode);
    
    chart.options.scales.x.min = -currentRange;
    chart.options.scales.x.max = currentRange;
    chart.options.scales.y.title.text = currentMode === '%' ? '% of parameters in range' : 'Absolute Count';
    
    chart.data.datasets.forEach((dataset, index) => {
      dataset.data = newData.datasets[index].data;
    });

    chart.update();
  }
</script>

</body>
</html>  <figcaption style="padding:8px 16px;font-size:16px;font-weight:650;color:black;">{{ $title }}</figcaption>
